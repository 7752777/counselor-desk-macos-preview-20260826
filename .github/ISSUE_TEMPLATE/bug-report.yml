name: Bug report
description: 报告可复现的问题或数据安全风险
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请只提交虚构或脱敏数据。真实学生资料、备份、截图和完整日志不要放在公开 Issue 中；安全问题请按 SECURITY.md 私密报告。
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请写出从启动到出现问题的最短步骤。
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与运行方式
      description: 例如 v4.4.5、Pages、离线 HTML、Windows 或 macOS。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请填写操作系统、浏览器或设备、视口尺寸等非敏感信息。
