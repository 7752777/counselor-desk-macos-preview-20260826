name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Complete test gate
    runs-on: ubuntu-latest
    # The measured v4.4 full suite includes browser, migration, and desktop
    # source smoke checks; five minutes would terminate a healthy candidate.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and public product surface
        run: |
          pnpm run lint
          pnpm run check:public
          pnpm run check:secrets

      - name: Run complete suite
        run: xvfb-run -a pnpm test

      - name: Run release checks
        run: pnpm run test:release

      - name: Test summary
        if: success()
        run: echo "All test suites and release checks passed"
